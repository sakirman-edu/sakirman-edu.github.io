# Welcome to Jekyll!
#
# Global configuration for:
# https://sakirman-edu.github.io/
#
# Academic profile of Dr. Sakirman, M.S.I.


# =========================================================
# BASIC SITE SETTINGS
# =========================================================

locale                   : "en-US"
site_theme               : "default"

title                    : "Dr. Sakirman, M.S.I."
title_separator          : "-"
name                     : &name "Dr. Sakirman, M.S.I."

description              : &description "Academic profile of Dr. Sakirman, M.S.I., researcher in Islamic Law and Islamic Astronomy, focusing on crescent visibility, twilight, hisab-rukyat, Hijri calendar studies, and contemporary Islamic law."

url                      : "https://sakirman-edu.github.io"
baseurl                  : ""

repository               : "sakirman-edu/sakirman-edu.github.io"


# =========================================================
# SITE AUTHOR
# =========================================================

author:

  avatar           : "sakirman-profile.jpg"

  name             : "Dr. Sakirman, M.S.I."

  pronouns         :

  bio              : "Researcher in Islamic Law and Islamic Astronomy, focusing on crescent visibility, twilight (syafaq), hisab-rukyat, and Hijri calendar studies."

  location         : "Metro, Lampung, Indonesia"

  employer         : "UIN Jurai Siwo Lampung"

  uri              : "https://sakirman-edu.github.io/"

  email            : "sakirman@metrouniv.ac.id"


  # =======================================================
  # ACADEMIC PROFILES
  # =======================================================

  academia         :

  arxiv            :

  googlescholar    : "https://scholar.google.com/citations?hl=en&user=eCtpuO8AAAAJ"

  inspire-hep      :

  impactstory      :

  orcid            : "https://orcid.org/0000-0002-9867-6505"

  semantic         :

  ssrn             :

  pubmed           :

  researchgate     : "https://www.researchgate.net/profile/Sakirman-Msi"

  scopus           : "https://www.scopus.com/authid/detail.uri?authorId=58665475300"

  zotero           :


  # =======================================================
  # REPOSITORIES
  # =======================================================

  bitbucket        :

  codepen          :

  dribbble         :

  github           : "sakirman-edu"

  kaggle           :

  stackoverflow    :


  # =======================================================
  # SOCIAL MEDIA
  # =======================================================

  artstation       :

  bluesky          :

  facebook         :

  flickr           :

  foursquare       :

  goodreads        :

  google_plus      :

  keybase          :

  instagram        :

  lastfm           :

  linkedin         :

  mastodon         :

  medium           :

  pinterest        :

  soundcloud       :

  steam            :

  telegram         :

  tumblr           :

  twitter          :

  vine             :

  weibo            :

  wikipedia        :

  xing             :

  youtube          :

  zhihu            :



# =========================================================
# PUBLICATION CATEGORY
# =========================================================

publication_category:

  books:
    title: "Books"

  manuscripts:
    title: "Journal Articles"

  conferences:
    title: "Conference Papers"



# =========================================================
# GENERAL SITE SETTINGS
# =========================================================

teaser                   : imagesog-sakirman.jpg

breadcrumbs              : false

words_per_minute         : 160

# Do not publish future-dated template/example posts
future                   : false

read_more                : "disabled"

talkmap_link             : false



# =========================================================
# COMMENTS
# =========================================================

comments:

  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :



# =========================================================
# STATICMAN
# =========================================================

staticman:

  allowedFields          :
    - name
    - email
    - url
    - message

  branch                 : "gh-pages"

  commitMessage          : "New comment."

  filename               : comment-{@timestamp}

  format                 : "yml"

  moderation             : true

  path                   : "_data/comments/{options.slug}"

  requiredFields         :
    - name
    - email
    - message

  transforms:

    email                : "md5"

  generatedFields:

    date:

      type               : "date"

      options:

        format           : "iso8601"



# =========================================================
# ATOM FEED
# =========================================================

atom_feed:

  hide                   : false

  path                   :



# =========================================================
# SEO VERIFICATION
# =========================================================

# Google Search Console is currently verified
# using the HTML verification file in repository root.
#
# Keep the verification HTML file in the repository.

google_site_verification :

bing_site_verification   :

alexa_site_verification  :

yandex_site_verification :



# =========================================================
# SOCIAL SHARING / OPEN GRAPH
# =========================================================

twitter:

  username               : &twitter


facebook:

  username               :

  app_id                 :

  publisher              :


# Default image used when a page has no specific image.
# File location:
# /images/imagesog-sakirman.jpg

og_image                 : imagesog-sakirman.jpg

og_description           : "Academic profile of Dr. Sakirman, M.S.I. in Islamic Law and Islamic Astronomy."



# =========================================================
# SOCIAL / PERSON ENTITY
# =========================================================

social:

  type                   : Person

  name                   : "Dr. Sakirman, M.S.I."

  links:

    - "https://scholar.google.com/citations?hl=en&user=eCtpuO8AAAAJ"

    - "https://orcid.org/0000-0002-9867-6505"

    - "https://www.researchgate.net/profile/Sakirman-Msi"

    - "https://www.scopus.com/authid/detail.uri?authorId=58665475300"

    - "https://github.com/sakirman-edu"



# =========================================================
# ANALYTICS
# =========================================================

analytics:

  provider               : "false"

  google:

    tracking_id          :



# =========================================================
# READING FILES
# =========================================================

include:

  - .htaccess

  - _pages

  - files



exclude:

  - "*.sublime-project"

  - "*.sublime-workspace"

  - .asset-cache

  - .bundle

  - .github

  - .jekyll-assets-cache

  - .sass-cache

  - assets/js/_main.js

  - assets/js/plugins

  - assets/js/vendor

  - CHANGELOG

  - Capfile

  - config

  - Dockerfile

  - Gemfile

  - Gruntfile.js

  - gulpfile.js

  - LICENSE

  - local

  - log

  - node_modules

  - package.json*

  - Rakefile

  - README

  - tmp

  - vendor



keep_files:

  - .git

  - .svn



encoding                 : "utf-8"

markdown_ext             : "markdown,mkdown,mkdn,mkd,md"



# =========================================================
# CONVERSION
# =========================================================

markdown                  : kramdown

highlighter               : rouge

lsi                       : false

excerpt_separator         : "\n\n"

incremental               : false



# =========================================================
# MARKDOWN PROCESSING
# =========================================================

kramdown:

  input                   : GFM

  hard_wrap               : false

  auto_ids                : true

  footnote_nr             : 1

  entity_output           : as_char

  toc_levels              : 1..6

  smart_quotes            : lsquo,rsquo,ldquo,rdquo

  enable_coderay          : false



# =========================================================
# COLLECTIONS
# =========================================================

collections:


  teaching:

    output                : true

    permalink             : /:collection/:path/


  publications:

    output                : true

    permalink             : /:collection/:path/


  insights:

    output                : true

    permalink             : /insights/:path/


  # Retained for AcademicPages compatibility.
  # Content is prevented from appearing in sitemap
  # through defaults below.

  portfolio:

    output                : true

    permalink             : /:collection/:path/


  talks:

    output                : true

    permalink             : /:collection/:path/



# =========================================================
# DEFAULTS
# =========================================================

defaults:


  # =======================================================
  # POSTS
  # =======================================================

  # Template/blog posts are not part of the current
  # academic website and should not appear in sitemap.

  - scope:

      path                : ""

      type                : posts

    values:

      layout              : single

      author_profile      : true

      read_time           : true

      comments            : true

      share               : true

      related             : true

      sitemap             : false



  # =======================================================
  # PAGES
  # =======================================================

  - scope:

      path                : ""

      type                : pages

    values:

      layout              : single

      author_profile      : true



  # =======================================================
  # TEACHING
  # =======================================================

  - scope:

      path                : ""

      type                : teaching

    values:

      layout              : single

      author_profile      : true

      share               : true

      comments            : true



  # =======================================================
  # PUBLICATIONS
  # =======================================================

  - scope:

      path                : ""

      type                : publications

    values:

      layout              : single

      author_profile      : true

      share               : true

      comments            : true



  # =======================================================
  # INSIGHTS
  # =======================================================

  - scope:

      path                : ""

      type                : insights

    values:

      layout              : single

      author_profile      : true

      read_time           : true

      share               : true

      comments            : false



  # =======================================================
  # PORTFOLIO
  # =======================================================

  # AcademicPages template portfolio is retained
  # for compatibility but excluded from sitemap.

  - scope:

      path                : ""

      type                : portfolio

    values:

      layout              : single

      author_profile      : true

      share               : true

      comment             : true

      sitemap             : false



  # =======================================================
  # TALKS
  # =======================================================

  # Template talks are retained for compatibility
  # but excluded from sitemap.

  - scope:

      path                : ""

      type                : talks

    values:

      layout              : talk

      author_profile      : true

      share               : true

      sitemap             : false



# =========================================================
# SASS / SCSS
# =========================================================

sass:

  sass_dir                : _sass

  style                   : compressed



# =========================================================
# OUTPUTTING
# =========================================================

permalink                 : /:categories/:title/

# paginate                : 5

# paginate_path           : /page:num/


timezone                  : Asia/Jakarta



# =========================================================
# PLUGINS
# =========================================================

plugins:

  - jekyll-feed

  - jekyll-gist

  - jekyll-paginate

  - jekyll-sitemap

  - jekyll-redirect-from

  - jemoji



# =========================================================
# GITHUB PAGES SAFE MODE
# =========================================================

whitelist:

  - jekyll-feed

  - jekyll-gist

  - jekyll-paginate

  - jekyll-sitemap

  - jekyll-redirect-from

  - jemoji



# =========================================================
# ARCHIVES
# =========================================================

category_archive:

  type                    : liquid

  path                    : /categories/


tag_archive:

  type                    : liquid

  path                    : /tags/



# =========================================================
# HTML COMPRESSION
# =========================================================

compress_html:

  clippings               : all

  comments                :

    - "<!-- "

    - " -->"

  ignore:

    envs                  : development
